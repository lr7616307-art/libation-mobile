name: Inspect LibriSync FFmpeg Android archive

on:
  push:
    branches:
      - fix/pass-8-audible-foreground-download

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Download pinned LibriSync FFmpeg AAR
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors \
            "https://raw.githubusercontent.com/Promises/LibriSync/d3c1b09993ab78def6d541b191ebd15390da6aae/build-assets/ffmpeg-kit.aar" \
            -o "$RUNNER_TEMP/ffmpeg-kit.aar"
          actual="$(git hash-object "$RUNNER_TEMP/ffmpeg-kit.aar")"
          expected="33f571d0e8bdda68156a34cd89098f2510b20ad4"
          echo "Pinned Git blob: $expected"
          echo "Downloaded Git blob: $actual"
          test "$actual" = "$expected"
          cp "$RUNNER_TEMP/ffmpeg-kit.aar" "$GITHUB_WORKSPACE/ffmpeg-kit.aar"
      - name: Inspect archive architectures and FFmpeg payload
        shell: bash
        run: |
          python3 - "$RUNNER_TEMP/ffmpeg-kit.aar" <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import sys
          aar = Path(sys.argv[1])
          with ZipFile(aar) as archive:
              names = archive.namelist()
              libs = [name for name in names if name.startswith("jni/") and name.endswith(".so")]
              abis = sorted({name.split("/")[1] for name in libs if len(name.split("/")) > 2})
              print(f"AAR size: {aar.stat().st_size:,} bytes")
              print(f"ABIs: {abis}")
              print(f"Native libraries: {len(libs)}")
              for abi in abis:
                  print(f"{abi}: {sum(name.startswith('jni/' + abi + '/') for name in libs)} libraries")
              required = {"armeabi-v7a", "arm64-v8a"}
              if not required.issubset(set(abis)):
                  raise SystemExit(f"Missing required ABIs: {sorted(required - set(abis))}")
              if not any(name.endswith("libavcodec.so") for name in libs):
                  raise SystemExit("FFmpeg codec library missing from AAR")
          PY
      - name: Upload pinned AAR for inspection
        uses: actions/upload-artifact@v4
        with:
          name: LibriSync-FFmpeg-Android-AAR
          path: ffmpeg-kit.aar
          if-no-files-found: error
          retention-days: 7
