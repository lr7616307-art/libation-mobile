name: Android APK

on:
  push:
    branches:
      - main
      - fix/pass-5-current-librisync-iphone-profile
      - feat/pass-7-audible-download-quality
      - feat/pass-8-widevine-license-bridge
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Run core tests
        run: dotnet test tests/Libation.Mobile.Core.Tests/Libation.Mobile.Core.Tests.csproj -c Release

  # Pull requests and feature-branch pushes compile both ABIs with CI-only
  # signing. These APKs are never uploaded and must not be installed.
  build_check:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/main')
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: android-arm
            abi: armeabi-v7a
          - rid: android-arm64
            abi: arm64-v8a
    steps:
      - uses: actions/checkout@v4
      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install Android workload
        run: dotnet workload install android
      - name: Fetch pinned LibriSync FFmpegKit runtime
        run: bash scripts/fetch-librisync-ffmpeg-android.sh
      - name: Restore
        run: dotnet restore src/Libation.Mobile.Android/Libation.Mobile.Android.csproj
      - name: Compile ${{ matrix.abi }} APK (CI only)
        run: dotnet publish src/Libation.Mobile.Android/Libation.Mobile.Android.csproj -c Release -r ${{ matrix.rid }} -p:AndroidPackageFormat=apk
      - name: Verify compile output exists
        shell: bash
        run: |
          set -euo pipefail
          output="src/Libation.Mobile.Android/bin/Release/net10.0-android36.0/${{ matrix.rid }}/publish"
          if ! compgen -G "$output/*.apk" > /dev/null; then
            echo "::error::No APK was produced for ${{ matrix.rid }}."
            exit 1
          fi
          find "$output" -maxdepth 1 -name '*.apk' -printf '%f %s bytes\n'

  # A test APK is published for the user's ARMv7 handset. It uses a branch-scoped,
  # cached CI test key so successive test builds can update in place. This is not
  # the production/release signing identity.
  build_test_apk:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/fix/pass-5-current-librisync-iphone-profile' || github.ref == 'refs/heads/feat/pass-7-audible-download-quality')
    needs: test
    runs-on: ubuntu-latest
    env:
      TEST_STORE_PASSWORD: vorath-ci-test-store
      TEST_KEY_PASSWORD: vorath-ci-test-key
    steps:
      - uses: actions/checkout@v4
      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Restore cached CI test signing key
        id: test-key-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/vorath-ci-test.jks
          key: vorath-ci-test-key-v1-${{ github.base_ref }}
      - name: Create CI test signing key when needed
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$RUNNER_TEMP/vorath-ci-test.jks")"
          if [[ ! -s "$RUNNER_TEMP/vorath-ci-test.jks" ]]; then
            keytool -genkeypair -v \
              -keystore "$RUNNER_TEMP/vorath-ci-test.jks" \
              -storetype JKS \
              -alias vorath-test \
              -keyalg RSA \
              -keysize 3072 \
              -validity 10000 \
              -dname "CN=VORATH CI Test,O=VORATH,C=IN" \
              -storepass "$TEST_STORE_PASSWORD" \
              -keypass "$TEST_KEY_PASSWORD"
          fi
          keytool -list -storetype JKS -keystore "$RUNNER_TEMP/vorath-ci-test.jks" \
            -alias vorath-test -storepass "$TEST_STORE_PASSWORD" \
            -keypass "$TEST_KEY_PASSWORD" >/dev/null
      - name: Install Android workload
        run: dotnet workload install android
      - name: Fetch pinned LibriSync FFmpegKit runtime
        run: bash scripts/fetch-librisync-ffmpeg-android.sh
      - name: Restore Android project
        run: dotnet restore src/Libation.Mobile.Android/Libation.Mobile.Android.csproj
      - name: Build installable ARMv7 test APK
        shell: bash
        run: |
          set -euo pipefail
          version_code=$((GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))
          dotnet publish src/Libation.Mobile.Android/Libation.Mobile.Android.csproj \
            -c Release -r android-arm --no-restore \
            -p:RuntimeIdentifiers= -p:AndroidCreatePackagePerAbi=false \
            -p:AndroidPackageFormat=apk -p:ApplicationVersion="$version_code" \
            -p:AndroidKeyStore=true \
            -p:AndroidSigningKeyStore="$RUNNER_TEMP/vorath-ci-test.jks" \
            -p:AndroidSigningStorePass="$TEST_STORE_PASSWORD" \
            -p:AndroidSigningKeyAlias=vorath-test \
            -p:AndroidSigningKeyPass="$TEST_KEY_PASSWORD"
          output="src/Libation.Mobile.Android/bin/Release/net10.0-android36.0/android-arm/publish"
          mapfile -t apks < <(find "$output" -maxdepth 1 -type f -name '*-Signed.apk')
          if (( ${#apks[@]} != 1 )); then
            echo "::error::Expected one signed ARMv7 APK; found ${#apks[@]}."
            find "$output" -maxdepth 1 -type f -name '*.apk' -print || true
            exit 1
          fi
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/Android/Sdk}}"
          apksigner="$(find "$sdk/build-tools" -type f -name apksigner | sort | tail -n 1)"
          test -n "$apksigner"
          "$apksigner" verify --print-certs "${apks[0]}"
          python3 - "${apks[0]}" <<'PY'
          import os
          import sys
          from pathlib import Path
          from zipfile import ZipFile

          apk = Path(sys.argv[1])
          with ZipFile(apk) as package:
              abis = {
                  name.split("/")[1]
                  for name in package.namelist()
                  if name.startswith("lib/") and len(name.split("/")) > 2
              }
          size = apk.stat().st_size
          print(f"Installable APK size: {size:,} bytes ({size / 1048576:.2f} MiB)")
          print(f"Native ABIs: {sorted(abis)}")
          with ZipFile(apk) as package:
              largest = sorted(
                  (info for info in package.infolist() if not info.is_dir()),
                  key=lambda info: info.compress_size,
                  reverse=True,
              )[:12]
          print("Largest compressed APK entries:")
          for info in largest:
              print(f"  {info.compress_size:>10,} bytes  {info.filename}")
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with Path(summary_path).open("a", encoding="utf-8") as summary:
                  summary.write("## VØRATH ARMv7 test APK\n\n")
                  summary.write(f"- Size: **{size:,} bytes ({size / 1048576:.2f} MiB)**\n")
                  summary.write(f"- Native ABI: **{', '.join(sorted(abis))}**\n")
                  summary.write("- Size budget: **40,000,000 bytes**\n\n")
                  summary.write("Largest compressed APK entries:\n\n")
                  for info in largest:
                      summary.write(f"- {info.compress_size:,} bytes — `{info.filename}`\n")
          if abis != {"armeabi-v7a"}:
              raise SystemExit(f"Expected only armeabi-v7a, got {sorted(abis)}")
          if size > 40_000_000:
              raise SystemExit(f"APK exceeds 24,000,000-byte size budget: {size:,}")
          PY
      - name: Save CI test signing key for future updates
        if: steps.test-key-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/vorath-ci-test.jks
          key: vorath-ci-test-key-v1-${{ github.event.pull_request.base.ref }}
      - name: Upload installable ARMv7 APK
        uses: actions/upload-artifact@v4
        with:
          name: VORATH-ARMv7-Test-APK
          path: src/Libation.Mobile.Android/bin/Release/net10.0-android36.0/android-arm/publish/*-Signed.apk
          if-no-files-found: error
          retention-days: 30

  # The Pass 8 PR targets Pass 7, so its pull_request run can restore the
  # Pass 7 branch-scoped test keystore. Build both pre- and post-optimization
  # APKs with that same identity so updates remain install-compatible.
  build_compatible_pair:
    if: github.event_name == 'pull_request' && github.base_ref == 'fix/pass-5-current-librisync-iphone-profile'
    needs: test
    runs-on: ubuntu-latest
    env:
      TEST_STORE_PASSWORD: vorath-ci-test-store
      TEST_KEY_PASSWORD: vorath-ci-test-key
      EXPECTED_TEST_CERT_SHA256: 33c0888390804d661889c74632265c5323e7f89308b327742e501992525f8218
    steps:
      - uses: actions/checkout@v4
      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Restore Pass 5 installed-app signing key
        id: test-key-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/vorath-ci-test.jks
          key: vorath-ci-test-key-v1-${{ github.event.pull_request.base.ref }}
      - name: Require the Pass 5 installed-app signing identity
        env:
          CACHE_HIT: ${{ steps.test-key-cache.outputs.cache-hit }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$CACHE_HIT" != "true" || ! -s "$RUNNER_TEMP/vorath-ci-test.jks" ]]; then
            echo "::error::Could not restore the Pass 5 test signing key from the Pass 5 base branch. Refusing to create an incompatible signing identity."
            exit 1
          fi
          keytool -list -storetype JKS -keystore "$RUNNER_TEMP/vorath-ci-test.jks" \
            -alias vorath-test -storepass "$TEST_STORE_PASSWORD" \
            -keypass "$TEST_KEY_PASSWORD" >/dev/null
      - name: Install Android workload
        run: dotnet workload install android
      - name: Fetch pinned LibriSync FFmpegKit runtime
        run: bash scripts/fetch-librisync-ffmpeg-android.sh
      - name: Restore optimized Pass 8 source
        run: dotnet restore src/Libation.Mobile.Android/Libation.Mobile.Android.csproj
      - name: Build optimized Pass 8 APK with the existing install identity
        shell: bash
        run: |
          set -euo pipefail
          base_version=$((GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))
          preopt_version=$((base_version + 1))
          optimized_version=$((base_version + 2))
          echo "PREOPT_VERSION=$preopt_version" >> "$GITHUB_ENV"
          dotnet publish src/Libation.Mobile.Android/Libation.Mobile.Android.csproj \
            -c Release -r android-arm --no-restore \
            -p:RuntimeIdentifiers= -p:AndroidCreatePackagePerAbi=false \
            -p:AndroidPackageFormat=apk -p:ApplicationVersion="$optimized_version" \
            -p:AndroidKeyStore=true \
            -p:AndroidSigningKeyStore="$RUNNER_TEMP/vorath-ci-test.jks" \
            -p:AndroidSigningStorePass="$TEST_STORE_PASSWORD" \
            -p:AndroidSigningKeyAlias=vorath-test \
            -p:AndroidSigningKeyPass="$TEST_KEY_PASSWORD"
          output="src/Libation.Mobile.Android/bin/Release/net10.0-android36.0/android-arm/publish"
          mapfile -t apks < <(find "$output" -maxdepth 1 -type f -name '*-Signed.apk')
          if (( ${#apks[@]} != 1 )); then
            echo "::error::Expected one optimized signed ARMv7 APK; found ${#apks[@]}."
            exit 1
          fi
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/Android/Sdk}}"
          apksigner="$(find "$sdk/build-tools" -type f -name apksigner | sort | tail -n 1)"
          test -n "$apksigner"
          cert_output="$("$apksigner" verify --print-certs "${apks[0]}" 2>&1)"
          printf '%s\n' "$cert_output"
          if ! printf '%s' "$cert_output" | grep -Fqi "$EXPECTED_TEST_CERT_SHA256"; then
            echo "::error::Optimized APK was not signed by the Pass 5 installed-app certificate."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/vorath-apks"
          cp "${apks[0]}" "$RUNNER_TEMP/vorath-apks/VORATH-ARMv7-Optimized-Fixed.apk"
          python3 - "$RUNNER_TEMP/vorath-apks/VORATH-ARMv7-Optimized-Fixed.apk" <<'PY'
          import sys
          from pathlib import Path
          from zipfile import ZipFile
          apk = Path(sys.argv[1])
          with ZipFile(apk) as package:
              abis = {
                  name.split("/")[1]
                  for name in package.namelist()
                  if name.startswith("lib/") and len(name.split("/")) > 2
              }
          size = apk.stat().st_size
          print(f"Optimized installable APK: {size:,} bytes ({size / 1048576:.2f} MiB)")
          print(f"Native ABIs: {sorted(abis)}")
          if abis != {"armeabi-v7a"}:
              raise SystemExit(f"Expected only armeabi-v7a, got {sorted(abis)}")
          if size > 40_000_000:
              raise SystemExit(f"APK exceeds 24,000,000-byte size budget: {size:,}")
          PY
      - name: Check out pre-optimization source
        uses: actions/checkout@v4
        with:
          ref: 54ec108de11493d449b33dafb1cc6d28887eae49
          path: preoptimization-source
      - name: Restore pre-optimization Android project
        run: dotnet restore preoptimization-source/src/Libation.Mobile.Android/Libation.Mobile.Android.csproj
      - name: Build original-size pre-optimization APK with the same signing identity
        shell: bash
        run: |
          set -euo pipefail
          dotnet publish preoptimization-source/src/Libation.Mobile.Android/Libation.Mobile.Android.csproj \
            -c Release -r android-arm \
            -p:RuntimeIdentifiers= -p:AndroidCreatePackagePerAbi=false \
            -p:AndroidPackageFormat=apk -p:ApplicationVersion="$PREOPT_VERSION" \
            -p:AndroidKeyStore=true \
            -p:AndroidSigningKeyStore="$RUNNER_TEMP/vorath-ci-test.jks" \
            -p:AndroidSigningStorePass="$TEST_STORE_PASSWORD" \
            -p:AndroidSigningKeyAlias=vorath-test \
            -p:AndroidSigningKeyPass="$TEST_KEY_PASSWORD"
          output="preoptimization-source/src/Libation.Mobile.Android/bin/Release/net10.0-android36.0/android-arm/publish"
          mapfile -t apks < <(find "$output" -maxdepth 1 -type f -name '*-Signed.apk')
          if (( ${#apks[@]} != 1 )); then
            echo "::error::Expected one original-size signed ARMv7 APK; found ${#apks[@]}."
            exit 1
          fi
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/Android/Sdk}}"
          apksigner="$(find "$sdk/build-tools" -type f -name apksigner | sort | tail -n 1)"
          test -n "$apksigner"
          cert_output="$("$apksigner" verify --print-certs "${apks[0]}" 2>&1)"
          printf '%s\n' "$cert_output"
          if ! printf '%s' "$cert_output" | grep -Fqi "$EXPECTED_TEST_CERT_SHA256"; then
            echo "::error::Original-size APK was not signed by the existing Pass 7 certificate."
            exit 1
          fi
          cp "${apks[0]}" "$RUNNER_TEMP/vorath-apks/VORATH-ARMv7-Original-Size.apk"
          python3 - "$RUNNER_TEMP/vorath-apks/VORATH-ARMv7-Original-Size.apk" <<'PY'
          import sys
          from pathlib import Path
          from zipfile import ZipFile
          apk = Path(sys.argv[1])
          with ZipFile(apk) as package:
              abis = {
                  name.split("/")[1]
                  for name in package.namelist()
                  if name.startswith("lib/") and len(name.split("/")) > 2
              }
          size = apk.stat().st_size
          print(f"Original-size installable APK: {size:,} bytes ({size / 1048576:.2f} MiB)")
          print(f"Native ABIs: {sorted(abis)}")
          if abis != {"armeabi-v7a"}:
              raise SystemExit(f"Expected only armeabi-v7a, got {sorted(abis)}")
          PY
      - name: Upload optimized fixed APK
        uses: actions/upload-artifact@v4
        with:
          name: VORATH-ARMv7-Optimized-Fixed
          path: ${{ runner.temp }}/vorath-apks/VORATH-ARMv7-Optimized-Fixed.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload original-size APK
        uses: actions/upload-artifact@v4
        with:
          name: VORATH-ARMv7-Original-Size
          path: ${{ runner.temp }}/vorath-apks/VORATH-ARMv7-Original-Size.apk
          if-no-files-found: error
          retention-days: 30

  # Only trusted release pushes or a manual dispatch publish installable APKs.
  build_release:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/fix/pass-5-current-librisync-iphone-profile'))
    needs: test
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      AndroidKeyStore: "true"
      AndroidSigningKeyAlias: ${{ secrets.ANDROID_KEY_ALIAS }}
      AndroidSigningKeyPass: ${{ secrets.ANDROID_KEY_PASSWORD }}
      AndroidSigningStorePass: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Check whether persistent signing is configured
        id: signing
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Stable APK publishing skipped. Add repository Actions secrets: ${missing[*]}"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Persistent signing secrets are present."
          fi
      - name: Set up Java
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Set private keystore path for subsequent build steps
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          signing_path="$RUNNER_TEMP/vorath-release.jks"
          echo "ANDROID_SIGNING_KEYSTORE=$signing_path" >> "$GITHUB_ENV"
          echo "AndroidSigningKeyStore=$signing_path" >> "$GITHUB_ENV"
      - name: Decode and validate persistent signing key
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_SIGNING_KEYSTORE"
          test -s "$ANDROID_SIGNING_KEYSTORE"
          keytool -list -storetype JKS -keystore "$ANDROID_SIGNING_KEYSTORE" -alias "$ANDROID_KEY_ALIAS" -storepass "$ANDROID_KEYSTORE_PASSWORD" -keypass "$ANDROID_KEY_PASSWORD" >/dev/null
          echo "Persistent Android signing key validated."
      - name: Calculate monotonic Android version code
        if: steps.signing.outputs.enabled == 'true'
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version_code=$((GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))
          if (( version_code > 2100000000 )); then
            echo "::error::Android versionCode exceeded Google's supported maximum."
            exit 1
          fi
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
          echo "Android versionCode: $version_code"
      - name: Install .NET
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install Android workload
        if: steps.signing.outputs.enabled == 'true'
        run: dotnet workload install android
      - name: Fetch pinned LibriSync FFmpegKit runtime
        run: bash scripts/fetch-librisync-ffmpeg-android.sh
      - name: Restore both Android runtimes
        if: steps.signing.outputs.enabled == 'true'
        run: dotnet restore src/Libation.Mobile.Android/Libation.Mobile.Android.csproj
      - name: Publish ARMv7 APK
        if: steps.signing.outputs.enabled == 'true'
        run: dotnet publish src/Libation.Mobile.Android/Libation.Mobile.Android.csproj -c Release -r android-arm --no-restore -p:RuntimeIdentifiers= -p:AndroidCreatePackagePerAbi=false -p:AndroidPackageFormat=apk -p:ApplicationVersion=${{ steps.version.outputs.version_code }}
      - name: Publish ARM64 APK
        if: steps.signing.outputs.enabled == 'true'
        run: dotnet publish src/Libation.Mobile.Android/Libation.Mobile.Android.csproj -c Release -r android-arm64 --no-restore -p:RuntimeIdentifiers= -p:AndroidCreatePackagePerAbi=false -p:AndroidPackageFormat=apk -p:ApplicationVersion=${{ steps.version.outputs.version_code }}
      - name: Verify ABI and signing identity
        if: steps.signing.outputs.enabled == 'true'
        shell: python
        run: |
          from pathlib import Path
          from zipfile import ZipFile
          import os
          import re
          import subprocess

          root = Path("src/Libation.Mobile.Android/bin/Release/net10.0-android36.0")
          apks = sorted(root.rglob("publish/*-Signed.apk"))
          if len(apks) != 2:
              raise SystemExit(f"Expected exactly 2 signed publish APKs, found {len(apks)}: {apks}")

          expected = {"armeabi-v7a", "arm64-v8a"}
          found = set()
          fingerprints = set()
          sdk_roots = [
              os.environ.get("ANDROID_HOME"),
              os.environ.get("ANDROID_SDK_ROOT"),
              "/usr/local/lib/android/sdk",
              str(Path.home() / "Android" / "Sdk"),
          ]
          build_tools = next(
              (Path(sdk) / "build-tools" for sdk in sdk_roots
               if sdk and (Path(sdk) / "build-tools").is_dir()),
              None,
          )
          if build_tools is None:
              raise SystemExit(f"Could not locate Android build-tools in: {sdk_roots}")
          candidates = sorted(build_tools.glob("*/apksigner"))
          if not candidates:
              raise SystemExit(f"Could not locate apksigner under {build_tools}")
          apksigner = str(candidates[-1])

          for apk in apks:
              with ZipFile(apk) as package:
                  abis = {
                      name.split("/")[1]
                      for name in package.namelist()
                      if name.startswith("lib/") and len(name.split("/")) > 2
                  }
              print(f"{apk}: {sorted(abis)} ({apk.stat().st_size} bytes)")
              if len(abis) != 1:
                  raise SystemExit(f"{apk} is not single-ABI: {sorted(abis)}")
              found.update(abis)

              verification = subprocess.run(
                  [apksigner, "verify", "--print-certs", str(apk)],
                  check=True, capture_output=True, text=True
              )
              match = re.search(
                  r"certificate SHA-256 digest: ([0-9a-fA-F]+)",
                  verification.stdout + verification.stderr,
                  re.IGNORECASE,
              )
              if not match:
                  raise SystemExit(f"Could not read signing certificate fingerprint from {apk}")
              fingerprints.add(match.group(1).lower())
              print(f"Signing certificate SHA-256: {match.group(1).lower()}")

          if found != expected:
              raise SystemExit(f"Expected APKs for {sorted(expected)}, found {sorted(found)}")
          if len(fingerprints) != 1:
              raise SystemExit(f"ARMv7 and ARM64 APKs do not share one signing identity: {sorted(fingerprints)}")

          print("Verified: both ABI APKs use the same persistent signing identity.")
      - name: Upload stable-signed ABI APKs
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: VORATH-StableSigned-ABI-specific
          path: src/Libation.Mobile.Android/bin/Release/net10.0-android36.0/**/publish/*-Signed.apk
          if-no-files-found: error
      - name: Remove temporary signing key
        if: always() && steps.signing.outputs.enabled == 'true'
        shell: bash
        run: |
          if [[ -n "${ANDROID_SIGNING_KEYSTORE:-}" ]]; then
            rm -f "$ANDROID_SIGNING_KEYSTORE"
          fi
