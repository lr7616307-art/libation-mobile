name: Android APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Run core tests
        run: dotnet test tests/Libation.Mobile.Core.Tests/Libation.Mobile.Core.Tests.csproj -c Release

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install Android workload
        run: dotnet workload install android
      - name: Restore both Android runtimes
        run: dotnet restore src/Libation.Mobile.Android/Libation.Mobile.Android.csproj
      - name: Publish ARMv7 APK
        run: dotnet publish src/Libation.Mobile.Android/Libation.Mobile.Android.csproj -c Release -r android-arm --no-restore -p:RuntimeIdentifiers= -p:AndroidCreatePackagePerAbi=false -p:AndroidPackageFormat=apk
      - name: Publish ARM64 APK
        run: dotnet publish src/Libation.Mobile.Android/Libation.Mobile.Android.csproj -c Release -r android-arm64 --no-restore -p:RuntimeIdentifiers= -p:AndroidCreatePackagePerAbi=false -p:AndroidPackageFormat=apk
      - name: Verify ABI-specific APKs
        shell: python
        run: |
          from pathlib import Path
          from zipfile import ZipFile

          root = Path("src/Libation.Mobile.Android/bin/Release/net10.0-android36.0")
          apks = sorted(root.rglob("publish/*-Signed.apk"))
          if len(apks) != 2:
              raise SystemExit(f"Expected exactly 2 signed publish APKs, found {len(apks)}: {apks}")

          expected = {"armeabi-v7a", "arm64-v8a"}
          found = set()
          for apk in apks:
              with ZipFile(apk) as package:
                  abis = {
                      name.split("/")[1]
                      for name in package.namelist()
                      if name.startswith("lib/") and len(name.split("/")) > 2
                  }
              print(f"{apk}: {sorted(abis)} ({apk.stat().st_size} bytes)")
              if len(abis) != 1:
                  raise SystemExit(f"{apk} is not single-ABI: {sorted(abis)}")
              found.update(abis)

          if found != expected:
              raise SystemExit(f"Expected APKs for {sorted(expected)}, found {sorted(found)}")
      - name: Upload signed ABI APKs
        uses: actions/upload-artifact@v4
        with:
          name: libation-mobile-ABI-specific
          path: src/Libation.Mobile.Android/bin/Release/net10.0-android36.0/**/publish/*-Signed.apk
          if-no-files-found: error
