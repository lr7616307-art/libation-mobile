name: Android APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Run core tests
        run: dotnet test tests/Libation.Mobile.Core.Tests/Libation.Mobile.Core.Tests.csproj -c Release

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install Android workload
        run: dotnet workload install android
      - name: Restore
        run: dotnet restore src/Libation.Mobile.Android/Libation.Mobile.Android.csproj
      - name: Build ABI-specific APKs
        run: dotnet publish src/Libation.Mobile.Android/Libation.Mobile.Android.csproj -c Release -r android-arm -p:AndroidCreatePackagePerAbi=true -p:AndroidPackageFormat=apk
      - name: Upload signed ABI APKs
        uses: actions/upload-artifact@v4
        with:
          name: libation-mobile-ABI-specific
          path: src/Libation.Mobile.Android/bin/Release/net10.0-android36.0/android-arm/publish/*-Signed.apk
          if-no-files-found: error
