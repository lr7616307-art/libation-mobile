name: Android APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Run core tests
        run: dotnet test tests/Libation.Mobile.Core.Tests/Libation.Mobile.Core.Tests.csproj -c Release

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: baseline
            strip_native_libraries: false
          - variant: compact
            strip_native_libraries: true
    steps:
      - uses: actions/checkout@v4
      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install Android workload
        run: dotnet workload install android
      - name: Restore
        run: dotnet restore src/Libation.Mobile.Android/Libation.Mobile.Android.csproj
      - name: Build split APKs (${{ matrix.variant }})
        run: dotnet publish src/Libation.Mobile.Android/Libation.Mobile.Android.csproj -c Release -p:AndroidPackageFormat=apk -p:AndroidCreatePackagePerAbi=true -p:AndroidStripNativeLibraries=${{ matrix.strip_native_libraries }}
      - name: Verify ABI APKs and generate reports
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import shutil
          import zipfile
          
          root = Path('src/Libation.Mobile.Android/bin/Release')
          expected = {'armeabi-v7a': 'ARMv7', 'arm64-v8a': 'ARM64'}
          found = set()
          candidates = []
          for path in root.rglob('*.apk'):
              if path.name.startswith('VORATH-') or 'unsigned' in path.name.lower():
                  continue
              try:
                  with zipfile.ZipFile(path) as archive:
                      names = [item.filename for item in archive.infolist()]
                      abis = set()
                      for name in names:
                          parts = name.split('/')
                          if len(parts) >= 3 and parts[0] == 'lib':
                              abis.add(parts[1])
                  if abis:
                      candidates.append((path, abis))
              except zipfile.BadZipFile:
                  continue
          print('Installable native APK candidates:')
          for path, abis in candidates:
              print(f'  {path}: {sorted(abis)}')
          for apk_path, abis in candidates:
              if len(abis) != 1:
                  raise SystemExit(f'{apk_path} contains multiple ABIs: {sorted(abis)}')
              abi = next(iter(abis))
              if abi not in expected:
                  raise SystemExit(f'Unexpected native ABI {abi} in {apk_path}')
              if abi in found:
                  raise SystemExit(f'More than one APK found for {abi}')
              found.add(abi)
              label = expected[abi]
              output_dir = Path('artifacts')
              output_dir.mkdir(exist_ok=True)
              output_apk = output_dir / f'VORATH-{label}.apk'
              shutil.copy2(apk_path, output_apk)
              digest = hashlib.sha256(output_apk.read_bytes()).hexdigest()
              size = output_apk.stat().st_size
              entries = []
              with zipfile.ZipFile(output_apk) as archive:
                  entries = [item for item in archive.infolist() if not item.is_dir()]
              report = output_dir / f'APK-REPORT-{label}.txt'
              with report.open('w', encoding='utf-8') as stream:
                  stream.write(f'Variant: ${{ matrix.variant }}\nABI: {abi}\nSource: {apk_path}\nAPK: {output_apk.name}\nSize: {size} bytes ({size / 1048576:.2f} MiB)\nSHA-256: {digest}\n')
                  stream.write('\nLargest compressed entries:\n')
                  for item in sorted(entries, key=lambda entry: entry.compress_size, reverse=True)[:30]:
                      stream.write(f'{item.compress_size:>12} compressed | {item.file_size:>12} uncompressed | {item.filename}\n')
              print(report.read_text(encoding='utf-8'))
          if found != set(expected):
              raise SystemExit(f'Missing ABI APK(s). Found {sorted(found)}; expected {sorted(expected)}')
          PY
      - name: Upload installable APKs and reports
        uses: actions/upload-artifact@v4
        with:
          name: vorath-${{ matrix.variant }}-apk
          path: artifacts/
          if-no-files-found: error
