name: Android APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Run core tests
        run: dotnet test tests/Libation.Mobile.Core.Tests/Libation.Mobile.Core.Tests.csproj -c Release

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: android-arm
            name: ARMv7
            variant: baseline
            strip_native_libraries: false
          - rid: android-arm
            name: ARMv7
            variant: compact
            strip_native_libraries: true
          - rid: android-arm64
            name: ARM64
            variant: baseline
            strip_native_libraries: false
          - rid: android-arm64
            name: ARM64
            variant: compact
            strip_native_libraries: true
    steps:
      - uses: actions/checkout@v4
      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install Android workload
        run: dotnet workload install android
      - name: Restore
        run: dotnet restore src/Libation.Mobile.Android/Libation.Mobile.Android.csproj
      - name: Build APK (${{ matrix.variant }})
        run: dotnet publish src/Libation.Mobile.Android/Libation.Mobile.Android.csproj -c Release -r ${{ matrix.rid }} -p:AndroidPackageFormat=apk -p:AndroidStripNativeLibraries=${{ matrix.strip_native_libraries }}
      - name: Measure APK
        shell: bash
        run: |
          set -euo pipefail
          apk_dir="src/Libation.Mobile.Android/bin/Release/net10.0-android36.0/${{ matrix.rid }}/publish"
          mapfile -t all_apks < <(find "$apk_dir" -maxdepth 1 -type f -name '*.apk' -print | sort)
          if [ "${#all_apks[@]}" -eq 0 ]; then
            echo "No APK was produced in $apk_dir." >&2
            exit 1
          fi
          printf 'APK candidates:\n%s\n' "${all_apks[@]}"
          mapfile -t signed_apks < <(printf '%s\n' "${all_apks[@]}" | grep -Ei '[-_]signed[.]apk || true)
          if [ "${#signed_apks[@]}" -eq 1 ]; then
            apk="${signed_apks[0]}"
          else
            mapfile -t installable_apks < <(printf '%s\n' "${all_apks[@]}" | grep -Eiv 'unsigned[.]apk$' || true)
            if [ "${#installable_apks[@]}" -ne 1 ]; then
              echo "Could not identify exactly one signed installable APK in $apk_dir." >&2
              exit 1
            fi
            apk="${installable_apks[0]}"
          fi
          bytes="$(stat -c '%s' "$apk")"
          mib="$(awk -v n="$bytes" 'BEGIN { printf "%.2f", n / 1048576 }')"
          output_apk="$apk_dir/VORATH-${{ matrix.name }}.apk"
          cp "$apk" "$output_apk"
          {
            echo "Variant: ${{ matrix.variant }}"
            echo "RID: ${{ matrix.rid }}"
            echo "Source APK: $(basename "$apk")"
            echo "Installable APK: $(basename "$output_apk")"
            echo "Size: $bytes bytes ($mib MiB)"
            sha256sum "$output_apk"
          } | tee "$apk_dir/APK-SIZE.txt"
      - name: Upload APK and size report
        uses: actions/upload-artifact@v4
        with:
          name: vorath-${{ matrix.name }}-${{ matrix.variant }}
          path: |
            src/Libation.Mobile.Android/bin/Release/net10.0-android36.0/${{ matrix.rid }}/publish/VORATH-${{ matrix.name }}.apk
            src/Libation.Mobile.Android/bin/Release/net10.0-android36.0/${{ matrix.rid }}/publish/APK-SIZE.txt
          if-no-files-found: error
 || true)
          if [ "${#signed_apks[@]}" -eq 1 ]; then
            apk="${signed_apks[0]}"
          else
            mapfile -t installable_apks < <(printf '%s\n' "${all_apks[@]}" | grep -Eiv 'unsigned[.]apk$' || true)
            if [ "${#installable_apks[@]}" -ne 1 ]; then
              echo "Could not identify exactly one signed installable APK in $apk_dir." >&2
              exit 1
            fi
            apk="${installable_apks[0]}"
          fi
          bytes="$(stat -c '%s' "$apk")"
          mib="$(awk -v n="$bytes" 'BEGIN { printf "%.2f", n / 1048576 }')"
          output_apk="$apk_dir/VORATH-${{ matrix.name }}.apk"
          cp "$apk" "$output_apk"
          {
            echo "Variant: ${{ matrix.variant }}"
            echo "RID: ${{ matrix.rid }}"
            echo "Source APK: $(basename "$apk")"
            echo "Installable APK: $(basename "$output_apk")"
            echo "Size: $bytes bytes ($mib MiB)"
            sha256sum "$output_apk"
          } | tee "$apk_dir/APK-SIZE.txt"
      - name: Upload APK and size report
        uses: actions/upload-artifact@v4
        with:
          name: vorath-${{ matrix.name }}-${{ matrix.variant }}
          path: |
            src/Libation.Mobile.Android/bin/Release/net10.0-android36.0/${{ matrix.rid }}/publish/VORATH-${{ matrix.name }}.apk
            src/Libation.Mobile.Android/bin/Release/net10.0-android36.0/${{ matrix.rid }}/publish/APK-SIZE.txt
          if-no-files-found: error
